<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Input Produk Elektronik - Sudut Nongkrong</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

    <main class="container">
        <section class="card form-section">
            <h2>Tambah Produk Elektronik Baru</h2>
            
            <form id="product-form">
                <div class="form-group">
                    <label for="product-name">Nama Produk:</label>
                    <input type="text" id="product-name" required placeholder="Contoh: Keyboard Mechanical Logitech G613">
                </div>

                <div class="form-group">
                    <label for="product-category">Kategori:</label>
                    <select id="product-category" required>
                        <option value="">-- Pilih Kategori --</option>
                        <option value="HP">HP</option>
                        <option value="Laptop">Laptop</option>
                        <option value="Mouse">Mouse</option>
                        <option value="Earphone">Earphone</option>
                        <option value="Powerbank">Powerbank</option>
                        <option value="Keyboard">Keyboard</option>
                        <option value="Wireless Charger">Wireless Charger</option>
                        <option value="Smartwatch">Smartwatch</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="product-price">Harga (Rp):</label>
                    <input type="number" id="product-price" required min="1000" placeholder="Contoh: 450000">
                </div>

                <div class="form-group">
                    <label for="product-stock">Stok Barang:</label>
                    <input type="number" id="product-stock" required min="0" placeholder="Contoh: 15">
                </div>

                <button type="submit" class="btn btn-primary">Simpan ke Mock Data</button>
            </form>

            <div id="form-feedback" class="feedback-msg"></div>
        </section>

        <section class="card preview-section">
            <h3>Live Preview Input</h3>
            <div id="live-preview" class="preview-box">
                <p class="preview-title"><strong id="prev-name">Nama Produk...</strong></p>
                <p class="preview-category">Kategori: <span id="prev-category">-</span></p>
                <p class="preview-price">Harga: <span id="prev-price">Rp 0</span> | Stok: <span id="prev-stock">0</span> pcs</p>
            </div>
            
            <hr class="divider">
            
            <h3>Daftar Produk Tersimpan & Agregasi</h3>
            <div class="summary-box">
                <p>Total Valuasi Stok: <strong id="total-valuation">Rp 0</strong></p>
            </div>

            <ul id="product-list" class="product-list">
                <li class="empty-msg">Belum ada produk tersimpan.</li>
            </ul>
        </section>
    </main>

    <!-- Skrip JavaScript penanganan form -->
    <script src="assets/js/form_handler.js"></script>
</body>
</html>
